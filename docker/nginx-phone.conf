# Public phone-only portal. No administration, session files, pairing creation,
# or deletion endpoints are exposed through these listeners.
server {
    listen 443 ssl;
    server_tokens off;
    ssl_certificate /etc/nginx/phone-tls/server.crt;
    ssl_certificate_key /etc/nginx/phone-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy 'camera=(self), microphone=()' always;
    location = / { return 302 /phone; }
    location = /phone { try_files /index.html =404; }
    location /assets/ { try_files $uri =404; }
    location = /phone-ca.crt { alias /etc/nginx/phone-tls/ca.crt; default_type application/x-x509-ca-cert; }
    location = /api/phone/stream {
        proxy_pass http://collection_hardware/phone/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 130s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
    location / { return 404; }
}
server {
    listen 81;
    server_tokens off;
    location = /phone-ca.crt { alias /etc/nginx/phone-tls/ca.crt; default_type application/x-x509-ca-cert; }
    location / { return 404; }
}
