# Docker may assign new IPs when services are recreated. Resolve them continuously
# instead of retaining the addresses seen when nginx starts (nginx >= 1.27.3).
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 5s;
upstream collection_backend {
    zone collection_backend 64k;
    server backend:8000 resolve;
}
upstream collection_hardware {
    zone collection_hardware 64k;
    server hardware-service:8001 resolve;
}

server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    location = /api/phone/stream {
        proxy_pass http://collection_hardware/phone/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 130s;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass http://collection_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location / { try_files $uri $uri/ /index.html; }
}
