# ROCm training and Ryzen AI NPU workers, included by make up. Mock collection stays accelerator-free.
services:
  backend:
    environment:
      TRAINING_URL: http://training-service:8002
  training-service:
    build:
      context: .
      dockerfile: docker/training.Dockerfile
      args:
        ROCM_GPU: ${ROCM_GPU:-gfx1152}
    environment:
      DATA_DIR: /data
      HARDWARE_URL: http://hardware-service:8001
      NOTIFIER_URL: http://dc-bot:8003
      NPU_URL: http://npu-service:8004
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    shm_size: '2gb'
    volumes:
      - ${DATA_PATH:-./data}:/data
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8002/health")']
      interval: 20s
      timeout: 10s
      start_period: 90s
      retries: 5
    stop_grace_period: 30s
    restart: unless-stopped
  npu-service:
    build:
      context: .
      dockerfile: docker/npu.Dockerfile
    environment:
      DATA_DIR: /data
      RYZEN_AI_INSTALLATION_PATH: /opt/ryzen-ai
    devices:
      - /dev/accel/accel0:/dev/accel/accel0
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${DATA_PATH:-./data}:/data
      - ${RYZEN_AI_PATH:-./ryzen_ai-1.8.0/.venv}:/opt/ryzen-ai:ro
      - /opt/xilinx/xrt:/opt/xilinx/xrt:ro
    healthcheck:
      test: ['CMD', '/opt/ryzen-ai/bin/python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8004/health")']
      interval: 20s
      timeout: 10s
      start_period: 30s
      retries: 5
    stop_grace_period: 30s
    restart: unless-stopped
