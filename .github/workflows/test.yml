name: Collection tests
on: [push, pull_request]
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
      - run: make mock
      - run: make test-ui
      - if: always()
        run: docker compose logs --tail=100
      - if: always()
        run: make down
